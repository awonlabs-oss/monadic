name: Ingest job boards

# Ingestion is a batch job, not a web request, and it is deliberately not on
# Vercel. A sweep of 254 boards took about fifteen minutes; a Vercel function on
# Hobby is capped at 300 seconds and on Pro at 800, so the only way to run it
# there is to slice it across invocations and carry a cursor between them —
# turning a simple loop into distributed state. A GitHub runner has six hours
# and no such problem.
#
# The board count is no longer 254. Seeding from the YC directory took the
# company list past 1,700, and resolution runs a slice per night rather than all
# at once, so the number of boards being pulled grows for a week or so after the
# directory is first pulled in and then settles.

on:
  schedule:
    # 06:00 UTC daily — roughly 2am New York, so a morning feed is already
    # fresh. Cron here is UTC and does not follow daylight saving; the hour
    # drifts by one against local time twice a year, which does not matter for
    # a job whose output is read hours later.
    - cron: "0 6 * * *"
  # So a run can be triggered by hand after changing the company list, without
  # waiting for tomorrow.
  workflow_dispatch:

# One sweep at a time. Two overlapping runs would both read the open set,
# both diff it, and race on the closure pass — the second finishing last would
# reopen or close rows based on a snapshot the first had already invalidated.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Was 45, for 254 boards and a company list that was already resolved. The
    # pull grows with the board count and the resolve slice is real work of its
    # own; this is headroom, not an estimate. The job still exits when done.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Regenerated in the runner rather than committed back, so a new YC batch
      # reaches the feed without anyone opening a pull request. The file in git
      # is the reproducible baseline: a checkout with no network still has a
      # seed list, and the diff of a deliberate local regeneration is reviewable.
      - name: Refresh the YC directory seeds
        env:
          INGEST_USER_AGENT: ${{ secrets.INGEST_USER_AGENT }}
        run: npm run discover:yc

      - name: Resolve any newly seeded companies
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          INGEST_USER_AGENT: ${{ secrets.INGEST_USER_AGENT }}
          INGEST_CONCURRENCY: "2"
        # A company already resolved is cached and skipped, so this is a no-op
        # on a list that has not changed. It is here so that adding a line to
        # companies.config.ts is the only step needed to start ingesting one.
        #
        # Capped per run. Resolving one company costs up to a dozen requests, and
        # an uncapped first pass over the directory backlog would not fit in any
        # sane wall clock. The cap makes the drain deliberate: a slice a night,
        # no cursor to keep, and a run that is killed part-way leaves everything
        # it never reached exactly as it found it.
        run: npm run resolve -- --limit 200

      - name: Pull every board
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          INGEST_USER_AGENT: ${{ secrets.INGEST_USER_AGENT }}
          INGEST_CONCURRENCY: "2"
        run: npm run ingest

      # The run summary is where a failure gets noticed. A per-company failure
      # does not fail the job — that was made deliberate so one bad board could
      # not discard the whole sweep — so without this the only signal would be
      # a green tick over a run that quietly stopped collecting something.
      - name: Summarise
        if: always()
        run: |
          {
            echo "### Ingest finished"
            echo ""
            echo "Company-level failures do not fail this job. Check the"
            echo "\`Pull every board\` step above for lines starting with"
            echo "FAILED or SUSPECT, and /settings/runs in the app for the"
            echo "full history."
          } >> "$GITHUB_STEP_SUMMARY"
